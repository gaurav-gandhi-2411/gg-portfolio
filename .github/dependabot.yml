version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # eslint-config-next@16.3.5's bundled eslint-plugin-react@7.37.5 (latest as of
    # 2026-09-23) still peer-deps on eslint ^9.7 and crashes under eslint 10 with
    # "contextOrFilename.getFilename is not a function" (ESLint 10 removed the
    # legacy context.getFilename() API). Re-open PR #137 once eslint-config-next
    # ships an eslint-plugin-react release with eslint 10 support.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
