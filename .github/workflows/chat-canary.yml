# Wave 16 hotfix — uptime canary for /api/chat. The route crashed in
# production for 4 days (missing onnxruntime-node native binary; see
# next.config.ts's outputFileTracingIncludes and lib/chatbot/answer.ts's
# serverErrorAnswer()) before GG found it by hand asking the chatbot
# himself — nothing was watching. This closes that gap: a real question,
# hitting the real production route, checked end to end (not just "did it
# return 200" — a route that's silently fail-soft-refusing everything due
# to a missing key or a broken retrieval index would still 200 and should
# still page).
#
# Same fail-soft, stable-title, update-in-place issue pattern as the other
# scheduled checks in metrics-refresh.yml.

name: Chat canary

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

concurrency:
  group: chat-canary
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      # Missing for the job's entire life until now (PR #163 added the `node
      # scripts/chatbot/check-canary-verdict.mjs` call below without adding
      # this) — every scheduled run since 2026-08-21 failed with "Cannot
      # find module .../check-canary-verdict.mjs" on a bare runner with no
      # repo checked out, and reported that identically to a real /api/chat
      # outage. canary-verdict.smoketest.mjs (wired into ci.yml's build job,
      # which does check out the repo) has been green the entire time
      # regardless, because it imports canary-verdict.mjs directly — it
      # exercises the verdict LOGIC, never this job's own wiring. That gap
      # is why the step below exists as a second, independent guard: even if
      # a future edit removes this checkout again, the job fails loudly and
      # distinctly instead of silently reporting a bad chat verdict.
      - name: Checkout
        uses: actions/checkout@v7

      # Fails fast, loud, and DIFFERENTLY from a real verdict failure — see
      # the two separate "Open/update" issue steps below, which read
      # steps.tooling.outcome specifically so an operator never has to open
      # the Actions log to tell "our CI is broken" apart from "the chatbot
      # is actually down." A silent identical-looking failure for both is
      # exactly what let this specific bug run unnoticed for two days.
      - name: Verify canary tooling is present
        id: tooling
        run: |
          if [ ! -f scripts/chatbot/check-canary-verdict.mjs ]; then
            echo "::error::scripts/chatbot/check-canary-verdict.mjs not found after checkout. This means the canary's own tooling is broken (moved/deleted/checkout misconfigured) — NOT that /api/chat is down. Do not treat this as a production chat outage."
            exit 1
          fi

      - name: Ask the production chatbot a real, answerable question
        id: probe
        if: steps.tooling.outcome == 'success'
        run: |
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            --max-time 45 \
            -X POST "https://gaurav-gandhi.vercel.app/api/chat" \
            -H "Content-Type: application/json" \
            -d '{"question":"What is Gaurav'"'"'s current role and background?"}' \
            || echo "000")

          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          BODY=$(cat "$RESPONSE_FILE")
          # GITHUB_OUTPUT can't hold raw newlines/quotes safely — heredoc form.
          {
            echo "body<<CANARY_BODY_EOF"
            echo "$BODY"
            echo "CANARY_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "non-200 status: $HTTP_STATUS"
            exit 1
          fi

          # A 200 with refused:true or zero citations means the pipeline
          # isn't actually answering — this is a genuinely answerable
          # question, so that's still a real failure, not a normal refusal.
          #
          # `refusalReason` (lib/chatbot/answer.ts) says WHICH failure, and
          # exists because this check could not. On 2026-08-16 Groq retired
          # the pinned model; every completion failed, the route turned that
          # into the same refusal it uses for an off-topic question, and this
          # job went red every six hours for two days saying only "refused".
          # That is a true statement about a healthy day too, so it named
          # nothing.
          #
          # The verdict logic itself used to live inline here, in a
          # bash-single-quoted `node -e '...'` block, and broke exactly this
          # way once already: the provider_unavailable runbook line contains
          # "Groq's", an apostrophe bash cannot escape inside a single-quoted
          # string, which terminated the quote early and turned the rest of
          # the prose into a shell syntax error on every run since. Extracted
          # to scripts/chatbot/canary-verdict.mjs (a real module, zero shell
          # quoting involved) specifically so that class of bug is
          # structurally impossible here again, and so the verdict logic can
          # be exercised by canary-verdict.smoketest.mjs against known-good
          # and known-bad responses instead of only ever running for real
          # against production every six hours -- a monitor nobody has seen
          # fail is not a monitor.
          #
          # Round three (GG): the reason+runbook computed here used to reach
          # only this job's own console output (stderr) -- never the actual
          # alert a human sees. The GitHub issue below read only http_status
          # and the raw response body, so telling a Groq 429 apart from a
          # genuine retrieval regression meant clicking into the Actions log
          # by hand, the exact manual step a canary exists to remove.
          # Capturing stdout+stderr and the exit code separately (rather
          # than just letting the pipeline's own exit code propagate) is
          # what lets the verdict reach $GITHUB_OUTPUT before this step
          # decides whether to fail.
          set +e
          VERDICT_OUTPUT=$(echo "$BODY" | node scripts/chatbot/check-canary-verdict.mjs 2>&1)
          VERDICT_EXIT=$?
          set -e
          echo "$VERDICT_OUTPUT"
          {
            echo "verdict<<CANARY_VERDICT_EOF"
            echo "$VERDICT_OUTPUT"
            echo "CANARY_VERDICT_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$VERDICT_EXIT"

      # Only fires when the tooling check itself failed — a broken CI
      # wiring, never touches production, gets its own title so it can
      # never be conflated with (or silently satisfy/close) a real chat
      # outage tracked under the other title below.
      - name: Open/update the failure issue (canary tooling broken)
        if: steps.tooling.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Chat canary tooling broken (not a chat outage)"
          BODY=$(cat <<EOF
          The scheduled canary (.github/workflows/chat-canary.yml) could not
          even run its verdict check: scripts/chatbot/check-canary-verdict.mjs
          was not found after checkout.

          - **When:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          This means the canary's own CI wiring is broken (the file was
          moved/deleted, or the checkout step was removed/misconfigured
          again) — it says NOTHING about whether /api/chat itself is
          working. Do not read this as a production outage.

          Fix by restoring the checkout step and/or the script at its
          expected path, then re-run this workflow (workflow_dispatch) to
          confirm both this issue and the real canary path close cleanly.
          Closing this issue is fine once fixed; the next scheduled run
          reopens it automatically if it's still broken.
          EOF
          )

          existing=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      # Only fires once the tooling check passed and the probe itself then
      # failed — a real signal about /api/chat, never conflated with a
      # broken canary (the step above owns that case, under a different
      # title, so the two can never merge into one ambiguous thread).
      - name: Open/update the failure issue (chatbot not answering)
        if: steps.tooling.outcome == 'success' && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HTTP_STATUS: ${{ steps.probe.outputs.http_status }}
          RESPONSE_BODY: ${{ steps.probe.outputs.body }}
          VERDICT: ${{ steps.probe.outputs.verdict }}
        run: |
          TITLE="Chat canary failing: /api/chat is not answering"
          BODY=$(cat <<EOF
          The scheduled canary (.github/workflows/chat-canary.yml) POSTed a
          real, answerable question to https://gaurav-gandhi.vercel.app/api/chat
          and did not get back a grounded answer.

          - **When:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - **HTTP status:** \`${HTTP_STATUS:-000}\`
          - **Verdict (refusalReason + runbook, empty for a non-200 status
            since the check never ran):**

          \`\`\`
          ${VERDICT:-(no verdict — the request itself failed before a response body existed to check; see HTTP status above)}
          \`\`\`
          - **Response body:**

          \`\`\`
          ${RESPONSE_BODY:-(no response — request may have timed out or failed to connect)}
          \`\`\`

          Check \`vercel logs\` / Vercel's runtime error dashboard for the
          actual server-side exception (route.ts logs requestId + stack on
          every 500 — see lib/chatbot/answer.ts's serverErrorAnswer()).
          Closing this issue is fine once fixed; the next scheduled run
          reopens it automatically if it's still broken, and this workflow
          auto-closes it once a run succeeds.
          EOF
          )

          existing=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      # Closes whichever of the two issue titles is open — a run only
      # reaches `success()` when both the tooling check and the probe
      # passed, so both problems (if either was open) are actually resolved.
      - name: Auto-close the failure issue(s) if this run succeeded
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for TITLE in \
            "Chat canary failing: /api/chat is not answering" \
            "Chat canary tooling broken (not a chat outage)"
          do
            existing=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Canary run succeeded — /api/chat is answering again and the canary's own tooling is intact. Closing."
              gh issue close "$existing"
            fi
          done
