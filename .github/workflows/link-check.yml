name: Link Check

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC — surfaces link rot even with no PR open.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    # Non-blocking on PRs: a link owned by a third party can rot between a PR
    # being opened and merged, and that is not the PR author's problem to fix.
    # The weekly scheduled run has no PR to annotate, so it fails loudly instead.
    #
    # This is NOT a licence to ignore the result. `.lychee.toml` retries every 5xx
    # and 429 four times over ~105s, so anything reported here has already
    # outlived cold starts and rate limits. A previous version of this comment
    # named "Cloud Run cold starts" as the example of ignorable noise, which on
    # 2026-08-13 nearly buried a real outage — review-iq's backend was 503-ing
    # because its GCP project had no billing account. Read the failure before
    # attributing it to the environment. See CHECKS.md instance 8.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            --format markdown
            content/**/*.ts
            app/**/*.tsx
            components/**/*.tsx
          fail: true
          jobSummary: true
