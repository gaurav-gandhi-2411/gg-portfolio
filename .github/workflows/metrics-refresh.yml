# Wave 13 — autonomous metric refresh. Weekly, PR-only (never a direct
# commit): the PR is the human gate that keeps rule 65b intact. Fail-soft
# end to end — an unreachable source repo skips that project with a note
# in the PR body; the site is never blanked by automation.
#
# Wave 15 — added the content-pipeline job below: extractor/curator/framer/
# verifier curation of newly-discovered facts (docs/content-pipeline-rubric.md),
# as its own separate PR from the metric-value refresh (see that job's header
# comment for why they're kept apart).
#
# Wave 16 — added the identity-drift job below: pure deterministic fact-
# checking (no LLM) of README display names, repo visibility/archived
# state, and live/demo/PyPI/HF URL health against content/identity-state.json.
# Its own PR too, same reasoning as content-pipeline's separation above —
# a mechanical fact-check diff shouldn't share a review with either the
# metric-value refresh or an LLM-curated content proposal.
#
# Wave 19 — two fixes, plus a new job:
#   1. `issues: write` added below. It was missing — an explicit `permissions:`
#      block makes every unlisted scope `none` (not "inherit the repo
#      default"), so every `gh issue create`/`gh issue edit` call in this
#      file (the "new repos" and "README renames" steps below) has been
#      running with zero issues permission since wave 14/16. Never caught
#      because both steps only run conditionally, and every real run to
#      date happened to find zero new repos and zero renames — the failing
#      code path was simply never exercised. Same root-cause SHAPE as the
#      `can_approve_pull_request_reviews` fix below: an untested failure
#      path sitting live in production.
#   2. The repo-level "Allow GitHub Actions to create and approve pull
#      requests" setting was OFF (`can_approve_pull_request_reviews: false`
#      via the REST API) — this is a repository setting, not something
#      fixable in this file, but it's the reason the content-pipeline and
#      identity-drift jobs' very first scheduled run (2026-07-27) failed at
#      their `gh pr create` step with "GitHub Actions is not permitted to
#      create or approve pull requests." Fixed via `gh api -X PUT
#      repos/.../actions/permissions/workflow -F can_approve_pull_request_reviews=true`;
#      confirmed by a manual `workflow_dispatch` re-run where all three jobs
#      (refresh, identity-drift, content-pipeline) succeeded and opened real
#      PRs (#34, #35).
#   3. New `metric-freshness` job: `refresh`'s diff is structurally blind to
#      drift when a source repo's OWN `.portfolio/metrics.json` manifest is
#      never refreshed (dealhunter's test count sat at a stale 597 for
#      weeks this way — the weekly refresh ran, found no diff, said
#      nothing). This job re-checks each metric against its cited source
#      file's actual current content instead of trusting an intermediate
#      manifest. See scripts/check-metric-freshness.mjs's header for the
#      full mechanism and its stated limits.
name: Content + metrics refresh

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      run_content_pipeline:
        description: >-
          Run the content-pipeline job. It's the only job here that spends
          Groq API budget — set to false for a manual dispatch that's only
          testing refresh/identity-drift/metric-freshness or the CI-status
          relay (scripts/relay-dispatched-ci-status.sh). Defaults to true so
          the scheduled Monday run (which has no inputs) and any dispatch
          that doesn't set this explicitly keep today's behavior.
        type: boolean
        default: true
      content_pipeline_force_invalid_token:
        description: >-
          workflow_dispatch-only R1 live-proof knob: when true, the
          content-pipeline job's run step gets a deliberately invalid
          GITHUB_TOKEN instead of the real github.token, so extractor.mjs's
          commit-SHA lookup gets a real 401 from api.github.com — a live,
          forced R3 failure without touching a real credential. Never set on
          the scheduled run (no `inputs` context there); defaults to false so
          an explicit dispatch that doesn't set this keeps today's behavior.
        type: boolean
        default: false
      content_pipeline_dry_run:
        description: >-
          workflow_dispatch-only: when true, the content-pipeline job's
          "Open PR" step exits immediately, before creating, updating, or
          closing anything — for a live proof run (forced-error or normal)
          that must not write a real PR/branch/comment. Defaults to false so
          the scheduled Monday run keeps opening real PRs.
        type: boolean
        default: false
      run_refresh:
        description: >-
          Run the refresh job. Set to false for a dispatch that's only
          testing content-pipeline (e.g. content_pipeline_dry_run above) and
          must not touch the real chore/metrics-refresh PR or the "New
          public repos" issue. Defaults to true so the scheduled Monday run
          and any dispatch that doesn't set this explicitly keep today's
          behavior.
        type: boolean
        default: true
      run_identity_drift:
        description: >-
          Run the identity-drift job. Same reasoning as run_refresh, for the
          chore/identity-drift PR and per-repo rename issues.
        type: boolean
        default: true
      run_metric_freshness:
        description: >-
          Run the metric-freshness job. Same reasoning as run_refresh, for
          the "Weekly metric freshness check" issue.
        type: boolean
        default: true
      verifier_model_override:
        description: >-
          workflow_dispatch-only R1 live-proof knob (fix/content-pipeline-llm-fail-loud, 2026-09):
          when non-empty, overrides scripts/content-pipeline/llm.mjs's verifier stage model id for
          this run only — e.g. a deliberately bad id to force a live 404 and prove the R3
          exit-non-zero path, or a known-good model id to prove the retry/success path, without
          hand-editing MODELS. Empty string (the default) keeps the pinned model; never set on the
          scheduled run.
        type: string
        default: ""

concurrency:
  group: metrics-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch ci.yml onto the PR branch (see below)
  issues: write # wave 19 fix — see header comment; was silently missing
  statuses: write # to relay the dispatched ci.yml run's result as a commit
    # status branch protection will actually see — see
    # scripts/relay-dispatched-ci-status.sh's header for why this is needed

jobs:
  refresh:
    # `if`: schedule runs (no `inputs` context) always run this job; a manual
    # workflow_dispatch runs it too unless the operator explicitly opts out
    # via `run_refresh=false` (see the input's own description).
    if: github.event_name != 'workflow_dispatch' || inputs.run_refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Refresh metrics from source repos
        env:
          SUMMARY_PATH: /tmp/metrics-summary.md
          NEW_REPOS_PATH: /tmp/new-repos.json
          # Was missing entirely — despite refresh-metrics.mjs's "Wave 21 fix" comment describing
          # an authenticated call, this step never actually passed a token, so every run has been
          # unauthenticated (60 req/hr). Found while wiring R3's exit-non-zero-on-API-error fix.
          GITHUB_TOKEN: ${{ github.token }}
          # A REPOSITORY SECRET, not a repo variable — read by
          # scripts/refresh-metrics.mjs to exclude repos from the
          # new-repo-discovery check without naming them anywhere in this
          # public repo (owner decision D3). Comma-separated repo names.
          # Deliberately a secret rather than `vars.*`: GitHub Actions
          # auto-masks `secrets.*` values in every log (including this
          # step's own auto-echoed `env:` block, the same place `GH_TOKEN`
          # shows as `***`) but does NOT mask `vars.*` — a first attempt at
          # this using `vars.PORTFOLIO_EXCLUDED_REPOS` printed both names in
          # plaintext in this workflow's own public Actions log the moment
          # it ran, defeating the entire point of not committing them.
          # `gh secret list` to confirm what's set (value itself is never
          # readable back); missing/empty = no exclusions, and the script
          # logs that fact (count only, never names) rather than staying
          # silent.
          PORTFOLIO_EXCLUDED_REPOS: ${{ secrets.PORTFOLIO_EXCLUDED_REPOS }}
        run: node scripts/refresh-metrics.mjs

      # R3: the step above now exits non-zero on a repo-inventory failure, which would otherwise
      # skip this step by default — but that failure is independent of whether metrics.json has a
      # real diff to propose, so this step must still run.
      - name: Open PR if anything changed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/metrics-refresh"

          if git diff --quiet content/metrics.json; then
            echo "No metric changes — no PR this week."
            # A prior week's PR may still be open with nothing left to
            # propose (its underlying drift already landed some other way,
            # or reverted on its own) — close it rather than leaving a stale
            # bot PR sitting open with no diff to review.
            existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch \
                --comment "This week's refresh found nothing to propose — closing. Reopens automatically (as a fresh PR) if drift shows up again."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add content/metrics.json
          git commit -m "chore(metrics): weekly metric refresh from source repos"
          # The refresh branch is owned by this workflow alone; force-push
          # replaces any stale unmerged run with the freshest numbers
          # (explicit single refspec per repo rule 38 — never --mirror/--all).
          git push --force origin "$BRANCH:refs/heads/$BRANCH"

          if ! gh pr create \
            --title "chore(metrics): weekly metric refresh" \
            --body-file /tmp/metrics-summary.md \
            --base main --head "$BRANCH"; then
            # PR from a previous week still open — refresh its body instead.
            gh pr edit "$BRANCH" --body-file /tmp/metrics-summary.md
          fi

          # PRs created with GITHUB_TOKEN don't trigger pull_request
          # workflows (GitHub anti-recursion rule), so the required `build`
          # check would sit absent forever. Dispatch CI onto the branch
          # explicitly — the check run lands on the same SHA the PR points
          # at, which satisfies branch protection.
          gh workflow run ci.yml --ref "$BRANCH"
          # ...but a dispatched run still doesn't register against branch
          # protection's required-status-check bookkeeping on its own — see
          # scripts/relay-dispatched-ci-status.sh's header for the mechanism.
          bash scripts/relay-dispatched-ci-status.sh "$BRANCH"

      # Wave 14: new-repo discovery doesn't change any tracked file (it's
      # "GG published something and didn't tell us," not a value drift), so
      # it can't ride the git-diff-gated PR above — a PR with zero file
      # changes isn't meaningful. An issue is the right vehicle for a pure
      # notification: update-in-place via a stable title so this doesn't
      # spam a new issue every week the same repo goes unaddressed.
      # R3: this step's whole job is reacting to a possible repo-inventory failure (the null-vs-[]
      # distinction below) — it must still run even though the refresh step above can now fail.
      - name: Open/update an issue for newly discovered repos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="New public repos not yet on the portfolio site"

          NEW_REPOS_CONTENT=$(cat /tmp/new-repos.json 2>/dev/null || echo "")
          if [ -z "$NEW_REPOS_CONTENT" ] || [ "$NEW_REPOS_CONTENT" = "null" ]; then
            # Bug fix (issue #122, rule 98a shape): scripts/refresh-metrics.mjs
            # writes `null` here (never `[]`) when the repo-inventory check
            # itself failed (e.g. a GitHub API rate limit) — that is NOT the
            # same fact as "checked, found nothing new," and treating it the
            # same silently is exactly how two unlisted repos (owner
            # decision D3) went unreported for weeks. Surface it
            # as a visible workflow annotation, and leave any existing open
            # issue untouched — an unverified run is not evidence the drift
            # resolved. R3 (2026-09): `::warning` + `exit 0` let the job report
            # success on a run whose repo-inventory check never completed —
            # named as an `::error` + non-zero exit instead now.
            echo "::error::Repo inventory check could not verify this run (scripts/refresh-metrics.mjs's repo-inventory step failed — see this run's summary/notes for why). This is NOT the same as 'no new repos found'; a repo published since the last successful run may be missing."
            exit 1
          fi
          if [ "$NEW_REPOS_CONTENT" = "[]" ]; then
            echo "No new repos found this week — closing any stale open issue."
            existing=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Latest run found no new repos — closing. Reopens automatically if a new one shows up unaddressed."
            fi
            exit 0
          fi

          BODY=$(node -e '
            const repos = require("/tmp/new-repos.json");
            const lines = repos.map(r => `- [\`${r.name}\`](${r.url})${r.description ? ` — ${r.description}` : ""}`);
            console.log([
              "Found by the weekly metrics-refresh run — these are public, non-fork, non-archived repos under gaurav-gandhi-2411 that aren'\''t linked from any product on the site and aren'\''t in `KNOWN_NON_PRODUCT_REPOS` (scripts/refresh-metrics.mjs).",
              "",
              ...lines,
              "",
              "If a repo here is a real project, it needs a case study (content/case-studies/) at the same depth as the other 12 — see reclaim'\''s wave-14 addition for the process. If it'\''s a support repo, add its name to `KNOWN_NON_PRODUCT_REPOS`. Closing this issue is fine once addressed; it reopens/recreates next time something new shows up unaddressed."
            ].join("\n"));
          ')

          existing=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  content-pipeline:
    # Wave 15 — separate job/PR from the metric-value refresh above: that job
    # mechanically refreshes already-known metric IDs (low-risk, deterministic
    # diff); this one curates NEWLY discovered facts from source-repo READMEs
    # through an extractor → curator → framer → verifier pipeline (LLM
    # judgment, not a deterministic diff) — see docs/content-pipeline-rubric.md.
    # Kept as its own PR so a reviewer isn't asked to judge a mechanical value
    # bump and an LLM-consensus content proposal in the same review.
    #
    # `if`: schedule runs (no `inputs` context) always run this job; a manual
    # workflow_dispatch runs it too unless the operator explicitly opts out
    # via `run_content_pipeline=false` (see the input's own description).
    if: github.event_name != 'workflow_dispatch' || inputs.run_content_pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Run the content curation pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIPELINE_SUMMARY_PATH: /tmp/content-pipeline-summary.md
          # Was missing — content-pipeline/extractor.mjs's commit-SHA lookup ran unauthenticated.
          # Added alongside R3's exit-non-zero-on-API-error fix (fix/github-api-scripts-fail-loud).
          # `content_pipeline_force_invalid_token` (workflow_dispatch-only R1 live-proof knob)
          # swaps in a deliberately bad token instead — real 401 from api.github.com, no live
          # network host needed and no real credential ever touched. False/unset (every
          # scheduled run, and any dispatch that doesn't set it) keeps the real github.token.
          GITHUB_TOKEN: ${{ inputs.content_pipeline_force_invalid_token && 'invalid-token-for-r1-forced-error-proof' || github.token }}
          # R1 live-proof knob — see verifier_model_override's own description above. Empty/unset
          # (every scheduled run, and any dispatch that doesn't set it) keeps llm.mjs's pinned
          # verifier model, since llm.mjs only honours this when the env var is non-empty.
          VERIFIER_MODEL_OVERRIDE: ${{ inputs.verifier_model_override }}
        run: node scripts/content-pipeline/run.mjs

      # R3: the step above can now exit non-zero on a commit-SHA lookup failure, which would
      # otherwise skip this step — but that's independent of whether any proposal reached the PR
      # bar this run.
      - name: Open PR if any proposal passed all three stages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow_dispatch-only R1 live-proof knob — see content_pipeline_dry_run's own
          # description above. A real proposal (or a stale open PR with nothing left to propose)
          # both write publicly below (push, gh pr create/edit/close); this must short-circuit
          # before either branch, not just the "nothing changed" one.
          CONTENT_PIPELINE_DRY_RUN: ${{ inputs.content_pipeline_dry_run }}
        run: |
          if [ "$CONTENT_PIPELINE_DRY_RUN" = "true" ]; then
            echo "Dry run (content_pipeline_dry_run input) — skipping PR create/update/close entirely; nothing public written this run."
            exit 0
          fi

          BRANCH="chore/content-pipeline"

          if git diff --quiet content/provenance.md; then
            echo "No proposals reached the PR bar this week."
            # See the identical close-on-clean comment in the refresh job
            # above — same reasoning, same fixed-branch-per-job pattern.
            existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch \
                --comment "This week's run found no proposals reaching the PR bar — closing. Reopens automatically (as a fresh PR) if a new proposal clears all three stages."
            fi
            exit 0
          fi

          # 2026-08-10: the pre-commit hook that normally keeps
          # content/chatbot/index.json in sync with provenance.md only runs
          # on a human's local commit — this job commits with GITHUB_TOKEN,
          # so a proposal PR always shipped with a stale index and failed
          # ci.yml's "Verify chatbot index is up to date" step (PR #59).
          # npm ci is new to this job specifically for build-index.mjs — the
          # other scripts here are dependency-free by design (see
          # lib/chatbot/embed.mjs's header), this is the one exception.
          npm ci
          node scripts/chatbot/build-index.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add content/provenance.md content/chatbot/index.json
          git commit -m "chore(content): weekly curated content proposals (LLM-consensus)"
          git push --force origin "$BRANCH:refs/heads/$BRANCH"

          if ! gh pr create \
            --title "chore(content): weekly curated content proposals" \
            --body-file /tmp/content-pipeline-summary.md \
            --base main --head "$BRANCH"; then
            gh pr edit "$BRANCH" --body-file /tmp/content-pipeline-summary.md
          fi

          # Same GITHUB_TOKEN anti-recursion workaround as the metrics-refresh
          # job above — PRs opened with GITHUB_TOKEN don't trigger
          # pull_request-triggered workflows, so dispatch ci.yml explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
          # Same required-status-check relay as the refresh job above.
          bash scripts/relay-dispatched-ci-status.sh "$BRANCH"

  identity-drift:
    # Wave 16 — pure deterministic fact-check, no LLM: does the README still
    # call the product what the site calls it, is the repo still public/
    # unarchived, are the live/demo/PyPI/HF surfaces still up. Diffed against
    # content/identity-state.json (same machine-owned-JSON convention as
    # content/metrics.json), its own PR for the same reason content-pipeline
    # gets one (see that job's header comment).
    #
    # `if`: same opt-out pattern as the refresh job above, via `run_identity_drift`.
    if: github.event_name != 'workflow_dispatch' || inputs.run_identity_drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run identity-drift check
        env:
          DRIFT_SUMMARY_PATH: /tmp/identity-drift-summary.md
          DRIFT_RENAMES_PATH: /tmp/identity-drift-renames.json
          # Was missing — identity-drift.mjs's repo-metadata lookups ran fully unauthenticated.
          # Added alongside R3's exit-non-zero-on-API-error fix and its new Authorization header.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/identity-drift.mjs

      # R3: the check above can now exit non-zero, which would otherwise skip this step — but that
      # failure is independent of whether identity-state.json has a real diff to propose.
      - name: Open PR if anything drifted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/identity-drift"

          if git diff --quiet content/identity-state.json; then
            echo "No identity drift this week."
            # See the identical close-on-clean comment in the refresh job
            # above — same reasoning, same fixed-branch-per-job pattern.
            existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh pr close "$existing" --delete-branch \
                --comment "This week's run found no identity drift — closing. Reopens automatically (as a fresh PR) if drift is found again."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add content/identity-state.json
          git commit -m "chore(identity): weekly identity-drift check"
          git push --force origin "$BRANCH:refs/heads/$BRANCH"

          if ! gh pr create \
            --title "chore(identity): weekly identity-drift check" \
            --body-file /tmp/identity-drift-summary.md \
            --base main --head "$BRANCH"; then
            gh pr edit "$BRANCH" --body-file /tmp/identity-drift-summary.md
          fi

          # Same GITHUB_TOKEN anti-recursion workaround as the metrics-refresh
          # job above — PRs opened with GITHUB_TOKEN don't trigger
          # pull_request-triggered workflows, so dispatch ci.yml explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
          # Same required-status-check relay as the refresh job above.
          bash scripts/relay-dispatched-ci-status.sh "$BRANCH"

      # A README rename is a real content decision, but the PR above is a
      # weekly-rotating chore branch that can sit unmerged (or unaddressed)
      # for a while — an issue is the right vehicle so a rename doesn't get
      # silently lost. One issue per renamed repo, stable-titled so it
      # updates in place rather than spamming a new issue every week the
      # same rename goes unaddressed (same pattern as the "new repos" issue
      # step in the refresh job above).
      # R3: same reasoning as "Open PR if anything drifted" above.
      - name: Open/update per-repo issues for README renames
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SLUGS=$(jq -r '.[]?.slug' /tmp/identity-drift-renames.json 2>/dev/null || true)

          # Close any previously-opened "Identity drift: <slug> renamed"
          # issue whose slug isn't in this week's renames list — the name
          # matched again, or the repo dropped out of tracking. Runs
          # unconditionally (including when this week's list is empty), so a
          # resolved drift doesn't sit open forever.
          gh issue list --search 'in:title "Identity drift:" in:title "renamed"' --state open --json number,title --jq '.[] | [(.number|tostring), .title] | @tsv' |
          while IFS=$'\t' read -r NUM ISSUE_TITLE; do
            SLUG=$(echo "$ISSUE_TITLE" | sed -E 's/^Identity drift: (.*) renamed$/\1/')
            if [ -n "$CURRENT_SLUGS" ] && echo "$CURRENT_SLUGS" | grep -qxF "$SLUG"; then
              continue # still drifted this week — the loop below updates it
            fi
            gh issue close "$NUM" --comment "No longer drifted (name matches again, or the repo dropped out of tracking) — closing. Reopens automatically if this rename shows up again."
          done

          if [ ! -s /tmp/identity-drift-renames.json ] || [ "$(cat /tmp/identity-drift-renames.json)" = "[]" ]; then
            echo "No README renames found this week."
            exit 0
          fi

          jq -c '.[]' /tmp/identity-drift-renames.json | while read -r entry; do
            SLUG=$(echo "$entry" | jq -r '.slug')
            TITLE="Identity drift: $SLUG renamed"
            BODY=$(ENTRY_JSON="$entry" node -e '
              const fs = require("node:fs");
              const entry = JSON.parse(process.env.ENTRY_JSON);
              // Bug fix (issue #200): this used to assert `entry.oldName` —
              // identity-state.json'\''s *previously recorded* README value
              // (e.g. `null`, on a product'\''s first successful check) — as
              // if it were content/products.ts'\''s current name. That is a
              // stale-cache claim, not a live read, and produced a false
              // report ("content/products.ts still lists this product as
              // \"null\"") for adk-tracegauge, whose products.ts entry had
              // said "adk-tracegauge" since before the drift run even
              // happened. Re-read products.ts fresh here instead.
              const productsSrc = fs.readFileSync("content/products.ts", "utf8").replace(/\r\n/g, "\n");
              const arrayBody = productsSrc.match(/products: Product\[\] = \[([\s\S]*)\];/)?.[1] ?? "";
              const blocks = [...arrayBody.matchAll(/^ {2}\{\n([\s\S]*?)\n {2}\},?$/gm)].map((m) => m[1]);
              const block = blocks.find((b) => new RegExp(`slug:\\s*"${entry.slug}"`).test(b));
              const currentSiteName = block?.match(/name:\s*"([^"]+)"/)?.[1] ?? "(slug not found in products.ts)";
              console.log([
                `The weekly identity-drift check (scripts/identity-drift.mjs) found that [\`${entry.repo}\`](${entry.repo})` + "'\''s README H1 changed:",
                "",
                `- Was: **${entry.oldName ?? "(no prior recorded value)"}**`,
                `- Now: **${entry.newName}**`,
                "",
                `content/products.ts currently lists this product as "${currentSiteName}" — decide whether the site name should follow the repo` + "'\''s rename, or whether this is an intentional divergence (several tracked products already use a nicer site name than their raw README, e.g. \"Samidha Reviews\" vs. review-iq" + "'\''s own README). Closing this issue is fine once addressed; it reopens/recreates next time the README name changes again."
              ].join("\n"));
            ')

            existing=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          done

  metric-freshness:
    # Wave 19 — see the file header comment (point 3) for why this exists
    # alongside `refresh` rather than inside it: `refresh`'s diff is against
    # each source repo's own possibly-stale manifest; this job re-checks
    # against the actual current source file content instead. Runs
    # independent of whether `refresh` found any change this week — that's
    # the whole point, it's built to catch exactly the drift `refresh`
    # structurally cannot see. Report-only: a stable-titled issue, not a
    # PR, since there's no proposed fix to review, just a signal a human
    # should look at content/metrics.json's cited sources for.
    #
    # Also runs a second, independent check (scripts/check-metric-freshness.mjs's
    # `checkVerifiedStaleness`): flags any case study whose `verifiedAt`
    # field (content/types.ts) is more than 30 days old, regardless of
    # whether any numeric drift was separately detected. Added after
    # triageiq's case study went stale despite a recent-looking commit —
    # see that field's own doc comment for the incident.
    #
    # `if`: same opt-out pattern as the refresh job above, via `run_metric_freshness`.
    if: github.event_name != 'workflow_dispatch' || inputs.run_metric_freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run metric freshness check
        env:
          FRESHNESS_SUMMARY_PATH: /tmp/metric-freshness-summary.md
          # Was missing — checkShaReachability's repo-metadata/compare calls ran fully
          # unauthenticated. Added alongside R3's exit-non-zero-on-API-error fix.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-metric-freshness.mjs
        # R3: a real GitHub API error now exits this step non-zero. Metric STALENESS
        # (drift, overdue verification, etc.) stays report-only via the summary file —
        # see the script's own comment on that split.

      # R3: the check above can now exit non-zero on a real API error, which would
      # otherwise skip this step — but the summary is already written by then (see
      # the script's own comment), and this step's whole job is reacting to it.
      - name: Open/update an issue if anything needs a look
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qE "Possible drift|Unverifiable this run|Overdue for re-verification|Could not check" /tmp/metric-freshness-summary.md; then
            echo "Nothing to report this week — closing any stale open issue."
            existing=$(gh issue list --search 'in:title "Weekly metric freshness check"' --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Latest run found nothing to report — closing. Reopens automatically if drift is found again."
            fi
            exit 0
          fi

          TITLE="Weekly metric freshness check: drift, unverifiable metrics, or overdue verification"
          existing=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/metric-freshness-summary.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/metric-freshness-summary.md
          fi
