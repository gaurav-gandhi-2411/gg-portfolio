name: Lighthouse (dispatch)

# Dispatch-only Lighthouse measurement against arbitrary URLs (production, a
# preview deploy, or a third-party comparison) on a clean GitHub-hosted
# runner — local Lighthouse on a dev machine is contaminated by whatever else
# is using the CPU at measurement time (see scripts/lighthouse-ci.mjs).
#
# A measurement tool, not a merge gate: workflow_dispatch only, never
# push/pull_request/schedule, and the job fails only on a genuine Lighthouse
# error (a URL that didn't load) — never on a score below the gate
# thresholds the summary itself reports.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space- or comma-separated absolute URL(s) to measure"
        required: true
        type: string
      runs:
        description: "Lighthouse runs per URL"
        required: false
        default: "5"
        type: string
      form_factor:
        description: "Lighthouse form factor"
        required: false
        default: "mobile"
        type: choice
        options:
          - mobile
          - desktop

concurrency:
  # Scoped by ref, same reasoning as live-link-latency.yml's own group: an
  # unscoped name would let a dispatch on one branch cancel an in-flight
  # dispatch on another. This job has no git-commit sequence to leave
  # half-done, so cancel-in-progress stays safe per-ref.
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inputs flow through `env:`, not string-interpolated into the shell
      # command below, so a dispatch input can never be read as shell syntax.
      - name: Run Lighthouse
        env:
          LH_URLS: ${{ inputs.urls }}
          LH_RUNS: ${{ inputs.runs }}
          LH_FORM_FACTOR: ${{ inputs.form_factor }}
          LH_OUTPUT_DIR: ${{ github.workspace }}/lighthouse-ci-output
        run: node scripts/lighthouse-ci.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-ci-output/
          retention-days: 14
          if-no-files-found: ignore
