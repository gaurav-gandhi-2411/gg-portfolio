name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by metrics-refresh.yml onto its PR branch: PRs created with
  # GITHUB_TOKEN don't fire pull_request workflows, so the required `build`
  # check has to be started explicitly.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
