name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by metrics-refresh.yml onto its PR branch: PRs created with
  # GITHUB_TOKEN don't fire pull_request workflows, so the required `build`
  # check has to be started explicitly.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Wave 14: no interactive feature ships as "verified" without this
      # job actually driving it in a browser — the gap that let wave 13's
      # category filters ship broken-feeling (reports/wave14-verification-
      # audit-2026-07-26.md). Runs against a real `next start` production
      # build (playwright.config.ts's webServer), not `next dev` — timing/
      # hydration behavior has to match what a visitor actually gets.
      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
