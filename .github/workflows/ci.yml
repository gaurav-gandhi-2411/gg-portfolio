name: CI

on:
  push:
    branches: [main]
  # Deliberately NOT filtered to `branches: [main]`. With that filter, a PR
  # stacked on another feature branch fires no CI at all — `build` and `e2e`
  # come back ABSENT rather than pending, and rule 70a treats an absent
  # required check exactly like a failing one. The effect was that a stacked
  # PR looked less verified than an unstacked one carrying identical code,
  # which is the same shape as any other control that is green while covering
  # less than its name implies.
  #
  # Found on PR #84 (hero WebGL layer, stacked on #83): only the Vercel checks
  # ever appeared, and the suite had to be started by hand via
  # workflow_dispatch. That workaround works but relies on someone remembering
  # it at exactly the moment the checks look merely slow rather than missing.
  #
  # Cost of removing the filter is one extra CI run per stacked PR, which is
  # cheap next to merging something whose tests never ran.
  pull_request:
  # Dispatched by metrics-refresh.yml onto its PR branch: PRs created with
  # GITHUB_TOKEN don't fire pull_request workflows, so the required `build`
  # check has to be started explicitly. Still needed — the trigger above
  # covers base-branch breadth, not the GITHUB_TOKEN case.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Wave 16 — the chatbot corpus index (content/chatbot/index.json) is a
      # build artifact of content/*.ts + content/provenance.md, not hand-
      # edited content itself. This catches someone editing a case study
      # without re-running the indexer.
      #
      # Extracted into scripts/chatbot/check-index-fresh.mjs (2026-08-07)
      # so the same comparison logic also runs as a pre-commit hook
      # (.pre-commit-config.yaml) — this CI step was never the gap (it
      # already ran on every PR); main broke twice anyway via paths this
      # step doesn't reach (a branch-protection bypass, and a content-only
      # edit committed without re-running the indexer first). The script's
      # own header has the full generatedAt-field and cosine-similarity-
      # tolerance rationale (Wave 19, PR #32's float32 noise-floor
      # measurement).
      - name: Verify chatbot index is up to date
        run: node scripts/chatbot/check-index-fresh.mjs

      # BL-9 — content/search/project-embeddings.json is a build artifact of
      # content/products.ts + content/types.ts, same class of thing as the
      # chatbot index above and the same reason it needs its own gate: see
      # scripts/search/check-project-embeddings-fresh.mjs's header.
      - name: Verify project search index is up to date
        run: node scripts/search/check-project-embeddings-fresh.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Wave 20 — same-project card-vs-case-study consistency (see
      # scripts/check-card-consistency.mjs's header for the incident this
      # closes). Zero network calls, same-repo only, fails closed on any
      # products.ts/metrics.json value contradicting its own case study.
      - name: Card/metrics/case-study consistency
        run: node scripts/check-card-consistency.mjs

      # 2026-08-10 — public/resume.pdf is a hand-built docx export, the one
      # artifact on the site outside every other gate; it went stale
      # unnoticed for weeks (see scripts/check-resume-pdf-consistency.mjs's
      # header for the incident). Runs on every PR, not path-filtered: the
      # failure mode is a human updating content/resume-data.json's numbers
      # without also regenerating and re-exporting the PDF, which this PR's
      # own diff won't necessarily touch either file to reveal.
      - name: Resume PDF vs. resume-data.json consistency
        run: node scripts/check-resume-pdf-consistency.mjs

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Wave 14: no interactive feature ships as "verified" without this
      # job actually driving it in a browser — the gap that let wave 13's
      # category filters ship broken-feeling (reports/wave14-verification-
      # audit-2026-07-26.md). Runs against a real `next start` production
      # build (playwright.config.ts's webServer), not `next dev` — timing/
      # hydration behavior has to match what a visitor actually gets.
      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # 2026-08-12 — deterministic, CI-blocking eager-JS bundle gate. The
      # 2026-07-12 wave-2 incident: a hand-enumerated chunk list forgot one
      # script tag (the core-js polyfill Next.js/Turbopack always bakes in,
      # ~39.6 KiB gzip) and silently reported a wrong, under-budget total
      # for a full day (reports/wave3-budget-reratification-2026-07-13.md).
      # scripts/check-bundle-size.mjs never hand-enumerates — it reads the
      # eager-shell file set from `.next/build-manifest.json` and
      # cross-checks it against what the live page actually serves.
      #
      # Placement (last step needing port 3000, not before the E2E suite)
      # is deliberate, after two failed attempts at cleaning up an earlier
      # start: neither killing by the PID `$!` captured across a step
      # boundary, nor killing by that same PID within one shared step, nor
      # `pkill -f "next start"` reliably freed :3000 before Playwright's
      # own webServer needed it next — three different real failures
      # chasing "did the cleanup actually work," never confirmable from
      # this job's own logs (PR #82's CI history has the details). Moving
      # this gate to run its OWN throwaway `npm run start` AFTER the E2E
      # suite (which owns correct start/stop of its own server via
      # playwright.config.ts's `webServer`) means nothing in this job ever
      # needs port 3000 again afterward — the entire class of "is the
      # cleanup step's kill actually reliable" bug is structurally
      # unreachable, not just harder to hit. No stop step needed: the
      # runner VM is destroyed at the end of the job regardless.
      - name: Bundle size gate (eager JS, gzip) — see scripts/check-bundle-size.mjs's header
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          node scripts/check-bundle-size.mjs
