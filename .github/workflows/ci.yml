name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by metrics-refresh.yml onto its PR branch: PRs created with
  # GITHUB_TOKEN don't fire pull_request workflows, so the required `build`
  # check has to be started explicitly.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Wave 16 — the chatbot corpus index (content/chatbot/index.json) is a
      # build artifact of content/*.ts + content/provenance.md, not hand-
      # edited content itself. This catches someone editing a case study
      # without re-running the indexer. `generatedAt` is real wall-clock
      # time and always differs between the committed file and a fresh
      # regen, so the comparison ignores that one field rather than doing a
      # literal `git diff --exit-code` (which would fail every run on
      # timestamp alone and give zero real signal).
      #
      # Wave 19 — `embedding` is compared by cosine similarity (>= 0.999),
      # not exact equality, and every other field stays exact. Found via a
      # real CI failure (PR #32): two consecutive GitHub Actions runs of
      # the unmodified indexer, on the identical commit, produced
      # byte-different float32 embedding values for identical text — WASM
      # ONNX execution's matmul/pooling reduction order isn't guaranteed
      # run-to-run, even single-threaded (lib/chatbot/embed.mjs forces
      # numThreads=1 for the same reason, which helps but doesn't fully
      # eliminate this). Exact-equality on a derived float vector was never
      # the right check for "did someone forget to re-run the indexer" —
      # that question is answered by the TEXT matching, which this still
      # checks exactly. A real regression (wrong model, wrong input text
      # embedded, embedding pipeline broken) would drop similarity far
      # below 0.999, not hover at 0.999999+.
      - name: Verify chatbot index is up to date
        run: |
          cp content/chatbot/index.json /tmp/chatbot-index-committed.json
          node scripts/chatbot/build-index.mjs
          node -e "
            const fs = require('fs');
            const committed = JSON.parse(fs.readFileSync('/tmp/chatbot-index-committed.json', 'utf8'));
            const fresh = JSON.parse(fs.readFileSync('content/chatbot/index.json', 'utf8'));
            delete committed.generatedAt;
            delete fresh.generatedAt;

            function cosineSim(a, b) {
              let dot = 0, normA = 0, normB = 0;
              for (let i = 0; i < a.length; i++) {
                dot += a[i] * b[i];
                normA += a[i] * a[i];
                normB += b[i] * b[i];
              }
              if (normA === 0 || normB === 0) return 0;
              return dot / (Math.sqrt(normA) * Math.sqrt(normB));
            }

            const SIMILARITY_FLOOR = 0.999;
            const problems = [];

            if (committed.chunkCount !== fresh.chunkCount || committed.model !== fresh.model) {
              problems.push('chunkCount/model mismatch: ' + JSON.stringify({ committed: { chunkCount: committed.chunkCount, model: committed.model }, fresh: { chunkCount: fresh.chunkCount, model: fresh.model } }));
            }

            const freshById = new Map(fresh.chunks.map((c) => [c.id, c]));
            for (const c of committed.chunks) {
              const f = freshById.get(c.id);
              if (!f) { problems.push('chunk ' + c.id + ' missing from fresh regeneration'); continue; }
              const { embedding: cEmb, ...cRest } = c;
              const { embedding: fEmb, ...fRest } = f;
              if (JSON.stringify(cRest) !== JSON.stringify(fRest)) {
                problems.push('chunk ' + c.id + ' non-embedding fields differ');
                continue;
              }
              const sim = cosineSim(cEmb, fEmb);
              if (sim < SIMILARITY_FLOOR) {
                problems.push('chunk ' + c.id + ' embedding similarity ' + sim.toFixed(6) + ' below floor ' + SIMILARITY_FLOOR);
              }
            }
            if (fresh.chunks.length !== committed.chunks.length) {
              problems.push('chunk count changed: committed ' + committed.chunks.length + ' vs fresh ' + fresh.chunks.length);
            }

            if (problems.length > 0) {
              console.error('content/chatbot/index.json is stale relative to content/*.ts + content/provenance.md.');
              console.error('Run: node scripts/chatbot/build-index.mjs, then commit the result.');
              problems.forEach((p) => console.error('  - ' + p));
              process.exit(1);
            }
            console.log('content/chatbot/index.json is up to date (' + committed.chunks.length + ' chunks, embeddings within tolerance).');
          "

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Wave 14: no interactive feature ships as "verified" without this
      # job actually driving it in a browser — the gap that let wave 13's
      # category filters ship broken-feeling (reports/wave14-verification-
      # audit-2026-07-26.md). Runs against a real `next start` production
      # build (playwright.config.ts's webServer), not `next dev` — timing/
      # hydration behavior has to match what a visitor actually gets.
      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
